[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extractscore"
version = "0.1.3"
description = "Field-level precision/recall/F1 for LLM-extracted JSON, with before/after run comparison and CI gates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["llm", "evaluation", "structured-output", "information-extraction", "json", "precision-recall"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/extractscore"
Issues = "https://github.com/LeeGyeongPil/extractscore/issues"
Changelog = "https://github.com/LeeGyeongPil/extractscore/blob/main/CHANGELOG.md"

[project.scripts]
extractscore = "extractscore.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/extractscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
